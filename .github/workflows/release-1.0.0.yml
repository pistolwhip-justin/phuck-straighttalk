name: Release DiagnosticWTF 1.0.0

on:
  push:
    branches:
      - diagnostic/1.0.0
    paths:
      - "source-import/datnet-share-v5-final/source/**"
      - ".github/workflows/release-1.0.0.yml"
      - "DIAGNOSTIC_BUILD.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out committed source
        uses: actions/checkout@v4

      - name: Guard immutable release
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.0 --json assets > /tmp/release.json 2>/dev/null; then
            if jq -e '.assets[] | select(.name == "PhuckStraightTalk-DiagnosticWTF-v1.0.0-debug.apk")' /tmp/release.json >/dev/null; then
              echo "Release v1.0.0 already has its expected APK; leaving it unchanged."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Release v1.0.0 exists but is missing its expected APK. Refusing to overwrite or repair it."
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.5
        if: steps.guard.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Verify and install Android SDK components
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          test -n "${ANDROID_HOME:-}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Run unit tests and assemble diagnostic APK
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd source-import/datnet-share-v5-final/source
          gradle --no-daemon testDebugUnitTest assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/PhuckStraightTalk-DiagnosticWTF-v1.0.0-debug.apk"

      - name: Create GitHub Release and upload diagnostic APK
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v1.0.0 "$GITHUB_WORKSPACE/PhuckStraightTalk-DiagnosticWTF-v1.0.0-debug.apk" \
            --title "Phuck StraightTalk DiagnosticWTF v1.0.0" \
            --notes "## DiagnosticWTF v1.0.0 — diagnostic-only build

          - Based on the known-good Phuck StraightTalk v5.0.3 source baseline.
          - Adds asynchronous event logging for app foreground/background, service lifecycle, sender and receiver wake-lock lifecycle, Wi-Fi Direct state transitions, sender traffic counters, and the receiver's existing TUN statistics cadence/packet/byte counters.
          - Adds an Export Diagnostic Logs control so logs can be saved as a text file.
          - Intended to observe existing behavior only. No wake-lock, network forwarding, retry, socket-buffer, or statistics interval optimization is intended.
          - Uses a separate application ID and can install alongside production.
          - Debug-signed APK for sideload diagnostics; not a production or Play Store release.
          - Device installation and operational behavior still require user testing.
          - Logs are stored in the app's private storage until exported. Review exported logs before sharing.
          - Original DataNet Share MIT license/copyright notices remain in force."

name: Release 5.0.0 Test APK

on:
  push:
    branches:
      - main
    paths:
      - "source-import/datnet-share-v5-final/source/**"
      - ".github/workflows/release-5.0.0.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out committed source
        uses: actions/checkout@v4

      - name: Guard immutable release
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v5.0.0 --json assets > /tmp/release.json 2>/dev/null; then
            if jq -e '.assets[] | select(.name == "PhuckStraightTalk-v5.0.0-debug.apk")' /tmp/release.json >/dev/null; then
              echo "Release v5.0.0 already has its expected APK; leaving it unchanged."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Release v5.0.0 exists but is missing its expected APK. Refusing to overwrite or repair it."
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.5
        if: steps.guard.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Set up Android SDK
        if: steps.guard.outputs.skip != 'true'
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Run unit tests and assemble debug APK
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd source-import/datnet-share-v5-final/source
          gradle --no-daemon testDebugUnitTest assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/PhuckStraightTalk-v5.0.0-debug.apk"

      - name: Create immutable GitHub Release and upload APK
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v5.0.0 PhuckStraightTalk-v5.0.0-debug.apk \
            --title "Phuck StraightTalk v5.0.0 — Test APK" \
            --notes "## Phuck StraightTalk v5.0.0 test build

          - Rebranded copy of DataNet Share 5.0.0.
          - Debug-signed APK for sideload testing; not a production or Play Store release.
          - Application ID: pro.pistolwhip.phuckstraighttalk
          - Minimum Android version: Android 8 (API 26).
          - The existing upstream implementation is preserved; device behavior still requires user testing.
          - Original project attribution and MIT license obligations remain in force."
